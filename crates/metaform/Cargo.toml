[package]
name = "metaform"
version.workspace = true
license = "MIT OR Apache-2.0"
edition = "2021"
description = "Query-driven representation change: the core state machine (the executable counterpart of the paper's formalization)"

[lib]
name = "metaform"
path = "src/lib.rs"

[[bin]]
name = "metaform"
path = "src/main.rs"

[dependencies]
metaform-kernel = { path = "../kernel" }
metaform-propose = { path = "../propose" }
metaform-store = { path = "../store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }




