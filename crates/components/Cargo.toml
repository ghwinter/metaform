[package]
name = "metaform-components"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Concrete proposal components for metaform: vector retrieval, structure mapping, label probing, and the readers the binaries need"

[dependencies]
metaform = { path = "../../engine" }
metaform-runtime = { path = "../runtime" }
metaform-vsa = { path = "../vsa" }
metaform-sme = { path = "../sme" }
metaform-ilp = { path = "../ilp" }

[[bin]]
name = "runtime_smoke"
path = "src/bin/runtime_smoke.rs"

[[bin]]
name = "metaform-runtime"
path = "src/bin/metaform_runtime.rs"
