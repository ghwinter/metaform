[package]
name = "metaform"
version = "0.5.0"
edition = "2021"
description = "Query-driven representation change: the core state machine (the executable counterpart of the paper's formalization)"

[lib]
name = "metaform"
path = "src/lib.rs"

[[bin]]
name = "metaform"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"




